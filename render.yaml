services:
  - type: web
    name: muthiana-voice-portal
    runtime: node
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: render-com
      - key: HOST
        value: "0.0.0.0"
